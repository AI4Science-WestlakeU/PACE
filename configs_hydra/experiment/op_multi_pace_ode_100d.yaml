# @package _global_
# Historical score used a saved Stage 1 model; this preset trains from scratch.
# See configs_archive and docs/recovered-results.md for the replay recipe.

defaults:
  - override /data: op_multi_100d
  - override /method: pace
  - override /model/stage1: pace_sinkhorn
  - override /model/stage2: ode
  - override /trainer: default

tags: [op_multi, pca, 100d, pace, ode]

task_name: op_multi_pace_100d

# Explicit 100D PCA variant so Hydra can select the dimensionality directly
# via experiment=... without requiring an extra data=... override.
hidden_dims_geopath: [64, 128, 128, 64]
hidden_dims_flow: [64, 128, 128, 64]

epochs: 1000
samples_per_timepoint: null
T_steps: 5
t_probe_steps: 2
total_epochs_stage1: 120
lambda_ortho: 1
lambda_global: 3
k_neighbors_local: 16
use_stage1_matching: true
rematch_every: 20
rematch_batch_i: 16
rematch_batch_j: 128
# Keep exact rematching on smaller snapshots, and only prune candidates when
# a timepoint grows beyond 2k cells.
rematch_candidate_topk: 32
rematch_candidate_min_points: 2000
