# @package _global_

defaults:
  - override /data: eb_phate
  - override /method: pace
  - override /model/stage1: pace_sinkhorn
  - override /model/stage2: ode
  - override /trainer: default

tags: [eb, phate, pace, ode]

task_name: eb_phate_pace

hidden_dims_geopath: [64, 128, 128, 64]
hidden_dims_flow: [64, 128, 128, 64]
epochs: 350
samples_per_timepoint: 1024
total_epochs_stage1: 120
lambda_ortho: 1
lambda_global: 3
lambda_metric: 1
k_neighbors_local: 32
optimal_transport_method: exact
use_stage1_matching: false
model/stage1: pace_sinkhorn
rematch_every: 20
geopath_lr: 0.003
