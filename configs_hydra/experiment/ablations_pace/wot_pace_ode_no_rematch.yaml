# @package _global_
# Ablation: disable periodic re-matching during Stage 1 (rematch_every=0).
# Output isolated under results/.../pace_no_rematch/ to avoid clobbering the
# baseline pace/ directory.

defaults:
  - override /data: wot_fle_three_interpolation
  - override /method: pace
  - override /model/stage1: pace_sinkhorn
  - override /model/stage2: ode
  - override /trainer: default

tags: [wot, scnode, schiebinger2019, three_interpolation, pace, ode, ablation, no_rematch]

task_name: wot_fle_three_interpolation_pace_no_rematch

method:
  name: pace
ablation_name: pace_no_rematch

hidden_dims_geopath: [64, 128, 128, 64]
hidden_dims_flow: [64, 128, 128, 64]
epochs: 600
samples_per_timepoint: 512
T_steps: 10
total_epochs_stage1: 80
lambda_ortho: 1
lambda_global: 3
lambda_metric: 1
k_neighbors_local: 16
use_stage1_matching: true
geopath_lr: 0.003

# Ablation override
rematch_every: 0
