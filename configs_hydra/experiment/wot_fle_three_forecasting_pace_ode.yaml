# @package _global_

defaults:
  - override /data: wot_fle_three_forecasting
  - override /method: pace
  - override /model/stage1: pace_hungarian
  - override /model/stage2: ode
  - override /trainer: default

tags: [wot, scnode, schiebinger2019, three_forecasting, pace, ode]

task_name: wot_fle_three_forecasting_pace

