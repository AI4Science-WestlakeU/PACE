# @package _global_

defaults:
  - override /model/stage1: pace_hungarian
  - override /model/stage2: ode

method:
  name: pace
  stages: 2
  default_run_name: pace

stage1_enabled: true

# PACE uses Hungarian matching — no OT plan sampler in stage 2
optimal_transport_method: "None"

# If true, Stage 2 reuses the final matchings from Stage 1 to pair (x0, x1)
# instead of random independent sampling per timepoint.
use_stage1_matching: true
