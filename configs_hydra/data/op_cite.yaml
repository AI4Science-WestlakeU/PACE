# @package _global_

# Open Problems CITEseq dataset from `data/embeddings/op_cite.h5ad`.
#
# Structure:
# - obsm['X_pca'].shape == (31240, 100)  — per-cell PCA scores
# - obs['day']: 4 timepoints [2, 3, 4, 7]
# - per-timepoint counts: 2→~7k, 3→~8k, 4→~11k, 7→~7k
#
# dim controls how many PCs to use (e.g. dim=50 uses first 50 PCs).

data_name: op_cite
data_path: data/embeddings/op_cite.h5ad
data_type: scrna_pca

dim: 5
whiten: true
time_column: day
feature_key: X_pca

split_ratios: [1.0, 0.0]
batch_size: 256

train_timepoint_labels: [2, 4, 7]
test_timepoint_labels: [3]

samples_per_timepoint: 1024
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: false
test_full_frame_batches: false
drop_last: false
num_workers: 0
pin_memory: false
