# @package _global_

# LARRY mouse hematopoiesis 2-D point cloud.
#
# Preprocessed NPZ contains:
# - positions.shape == (N, 2)      — 2-D embedding (PCA or SPRING)
# - timepoints.shape == (N,)       — integer time labels
# - clone_ids.shape == (N,)        — LARRY clone barcode ids
# - lineage_labels.shape == (N,)   — lineage annotation
# - fate_labels.shape == (N,)      — fate annotation
#
# Current timepoints: 'day2', 'day4', 'day6' (3 snapshots)
# They are automatically remapped to numeric labels 0, 1, 2 by LARRYDataModule.
# Use numeric labels in train/test config below.

data_name: larry_pca2
data_path: /wangchuanrui2/code/2flow/experiments/EXP-20260618-02/data/larry_pca2.npz
data_type: temporal_point_cloud

dim: 2
whiten: false

split_ratios: [1.0, 0.0]
batch_size: 256

# Train on endpoints (day2 -> numeric 0, day6 -> numeric 2), hold out middle (day4 -> numeric 1).
train_timepoint_labels: [0, 2]
test_timepoint_labels: [1]

samples_per_timepoint: 1024
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: false
test_full_frame_batches: false
drop_last: false
num_workers: 0
pin_memory: false

# Keys inside the NPZ file.
position_key: positions
timepoint_key: timepoints
clone_id_key: clone_ids
fate_label_key: fate_labels
lineage_label_key: lineage_labels
