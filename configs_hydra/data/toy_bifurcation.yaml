# @package _global_

# Two-branch toy temporal point cloud generated by
# `src/data_preprocess/generate_two_branch_data.py`.
#
# Current structure:
# - positions is an object array of 6 frames
# - each frame has shape (64, 2)
# - timepoints are 0..5

data_name: toy_bifurcation
data_path: data/toy_bifurcation/toy_bifurcation.npz
data_type: temporal_point_cloud

dim: 2
whiten: false
split_ratios: [1, 0]

batch_size: 64

# Train on anchors and evaluate held-out interpolation frames.
train_timepoint_labels: [0, 2, 3, 5]
test_timepoint_labels: [1, 4]

samples_per_timepoint: 64
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: true
test_full_frame_batches: true
drop_last: false
num_workers: 0
pin_memory: false
