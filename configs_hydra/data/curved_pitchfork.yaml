# @package _global_

# CurvedPitchfork synthetic benchmark.
# Generated by src/data_preprocess/generate_curved_pitchfork.py

data_name: curved_pitchfork
data_path: data/curved_pitchfork/curved_pitchfork.npz
data_type: temporal_point_cloud

dim: 2
whiten: false

split_ratios: [1.0, 0.0]
batch_size: 256

# Train on even snapshots, test on odd snapshots.
train_timepoint_labels: [0, 2, 4, 6, 8]
test_timepoint_labels: [1, 3, 5, 7]

samples_per_timepoint: null
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: false
test_full_frame_batches: false
drop_last: false
num_workers: 0
pin_memory: false

# Keys for GT labels stored in the NPZ.
particle_id_key: particle_ids
branch_label_key: branch_labels
velocity_key: velocity
tangent_key: tangent_unit
normal_key: normal_unit
