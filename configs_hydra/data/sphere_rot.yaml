# @package _global_

# SphereRot synthetic benchmark.
# Points on S^2 rotating rigidly about the z-axis.

data_name: sphere_rot
data_type: temporal_point_cloud

# 3-D ambient coordinates
dim: 3
whiten: false

split_ratios: [1.0, 0.0]
batch_size: 256

# Alternate train/test snapshots; hold out odd timepoints.
train_timepoint_labels: [0, 2, 4, 6, 8]
test_timepoint_labels: [1, 3, 5, 7]

samples_per_timepoint: null
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: false
test_full_frame_batches: false
drop_last: false
num_workers: 0
pin_memory: false

# SphereRot-specific generation parameters.
sphere_n_points: 2048
sphere_n_timepoints: 9
sphere_omega: 1.5707963267948966  # pi/2
sphere_alpha_true: 8.0
sphere_noise_sigma: 0.0
sphere_seed: 42

# No clone/fate labels for this synthetic dataset.
clone_id_key: ""
fate_label_key: ""
lineage_label_key: ""
