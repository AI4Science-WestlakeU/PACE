# @package _global_

# Open Problems Multiome dataset from
# `data/embeddings/op_multi.h5ad`.
#
# 5D setting: use the first 5 PCA components from `obsm['X_pca']`.

data_name: op_multi
data_path: data/embeddings/op_multi.h5ad
data_type: scrna_pca

dim: 5
whiten: true
time_column: day
feature_key: X_pca

split_ratios: [1.0, 0.0]
batch_size: 256

train_timepoint_labels: [2, 4, 7]
test_timepoint_labels: [3]

samples_per_timepoint: null
equalize_timepoint_counts: false
allow_replacement: false

preserve_frame_order: false
full_frame_batches: false
test_full_frame_batches: false
drop_last: false
num_workers: 0
pin_memory: false
